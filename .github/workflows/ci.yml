name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python + PostgreSQL 17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exam_owner
          POSTGRES_PASSWORD: ci_only_password # BD efímera del runner, no es un secreto
          POSTGRES_DB: exam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exam_owner -d exam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://exam_owner:ci_only_password@localhost:5432/exam_test
      TEST_DATABASE_URL: postgresql+psycopg://exam_app:ci_app_password@localhost:5432/exam_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Crear rol de aplicación
        env:
          PGPASSWORD: ci_only_password
        run: psql -h localhost -U exam_owner -d exam_test -c "CREATE ROLE exam_app LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOBYPASSRLS"
      - run: ruff check .
      - run: ruff format --check .
      - name: Pruebas (migraciones, RLS, restricciones, health)
        run: python -m pytest -q
      - name: Modelo y migraciones sincronizados
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
        run: alembic upgrade head && alembic check

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Sin claves ni campos privados en el bundle
        run: npm run check:bundle

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
