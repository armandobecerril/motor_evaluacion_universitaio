# PostgreSQL 17 local para desarrollo y pruebas (opcional si usas Homebrew).
# Contraseñas SOLO de desarrollo local.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: exam_owner
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: exam_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/scripts/docker-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_owner -d exam_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
